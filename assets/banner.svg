
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="300" viewBox="0 0 1200 300">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080D0A"/>
      <stop offset="55%" stop-color="#111D15"/>
      <stop offset="100%" stop-color="#07110B"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#55D879"/>
      <stop offset="100%" stop-color="#A1E9AE"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#39FF75" stop-opacity=".13"/>
      <stop offset="100%" stop-color="#39FF75" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="32" height="32"
             patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32"
            fill="none"
            stroke="#7FAF89"
            stroke-opacity=".07"
            stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <ellipse cx="1080" cy="150" rx="300" ry="220" fill="url(#glow)"/>

  <!-- Border -->
  <rect x="1" y="1" width="1198" height="298" rx="18"
        fill="none" stroke="#42694B" stroke-opacity=".55"/>

  <!-- Terminal prompt -->
  <text x="65" y="65"
        fill="#79D991"
        font-family="monospace"
        font-size="17">
    prithvi@dev:~$ whoami
  </text>

  <rect x="258" y="48" width="9" height="20"
        fill="#79D991" rx="1"/>

  <!-- Main heading -->
  <text x="65" y="158"
        fill="#F0F4F0"
        font-family="Arial, Helvetica, sans-serif"
        font-size="58"
        font-weight="700"
        letter-spacing="-2">
    Hi, I'm
  </text>

  <text x="245" y="158"
        fill="url(#accent)"
        font-family="Arial, Helvetica, sans-serif"
        font-size="58"
        font-weight="700"
        letter-spacing="-2">
    Prithvi Raj.
  </text>

  <!-- Accent line -->
  <rect x="65" y="181" width="68" height="3" rx="2"
        fill="#65D982"/>

  <!-- Developer role -->
  <text x="65" y="224"
        fill="#D5E3D7"
        font-family="monospace"
        font-size="20">
    BACKEND DEVELOPER
  </text>

  <!-- Tagline -->
  <text x="65" y="257"
        fill="#91A995"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15">
    Building Reliable APIs  ·  Scalable Systems
  </text>

  <!-- Minimal code decoration -->
  <g fill="none" stroke="#71C989" stroke-width="2.5"
     stroke-linecap="round" stroke-linejoin="round"
     opacity=".65">
    <path d="M1015 110 L990 135 L1015 160"/>
    <path d="M1060 110 L1085 135 L1060 160"/>
    <path d="M1047 105 L1028 165"/>
  </g>

  <!-- Bottom accent -->
  <rect x="65" y="279" width="1070" height="1"
        fill="#6CA77A" opacity=".3"/>
  <circle cx="1135" cy="279" r="3" fill="#65D982"/>

</svg>
